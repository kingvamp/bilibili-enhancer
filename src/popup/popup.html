<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站增强设置</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <div style="display: flex; align-items: baseline;">
            <h2 style="margin-right: 8px;">Bilibili Enhancer</h2>
            <a href="#" id="github-star" style="font-size: 12px; text-decoration: none; color: #888;"
                title="前往 GitHub 仓库">点亮⭐</a>
        </div>
        <span class="version" id="app-version"></span>
    </div>

    <div class="container">
        <div class="section-group">
            <div class="group-title">播放与常规</div>

            <div class="setting-item">
                <div class="label-box">
                    <span>显示毫秒时间</span>
                    <span class="tooltip-icon" data-tooltip="在播放器进度条右侧显示精确到毫秒的时间戳">?</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-ms">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item column-layout">
                <div class="label-box">
                    <span>封面预览大小</span>
                </div>
                <div class="segmented-control">
                    <label>
                        <input type="radio" name="cover-size" value="off">
                        <span class="seg-item">关闭</span>
                    </label>
                    <label>
                        <input type="radio" name="cover-size" value="small">
                        <span class="seg-item">小</span>
                    </label>
                    <label>
                        <input type="radio" name="cover-size" value="medium">
                        <span class="seg-item">中</span>
                    </label>
                    <label>
                        <input type="radio" name="cover-size" value="large">
                        <span class="seg-item">大</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="section-group">
            <div class="group-title">缩略图信息增强</div>

            <div class="setting-item column-layout">
                <div class="label-box">
                    <span>收藏/点赞状态显示</span>
                </div>
                <div class="segmented-control" id="status-mode-group">
                    <label>
                        <input type="radio" name="status-mode" value="off">
                        <span class="seg-item">关闭</span>
                    </label>
                    <label>
                        <input type="radio" name="status-mode" value="text">
                        <span class="seg-item">文字</span>
                    </label>
                    <label>
                        <input type="radio" name="status-mode" value="triangle">
                        <span class="seg-item">角标</span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <span>显示分辨率 (4K/1080P)</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-thumb-res">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <span>显示分P数量</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-thumb-pcount">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="label-box">
                    <span>显示已下载角标</span>
                    <span id="downloaded-count" class="count-badge"></span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-thumb-downloaded">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item column-layout">
                <div class="label-box">
                    <span>充电专属视频处理</span>
                </div>
                <div class="segmented-control">
                    <label>
                        <input type="radio" name="charging-mode" value="off">
                        <span class="seg-item">关闭</span>
                    </label>
                    <label>
                        <input type="radio" name="charging-mode" value="mask">
                        <span class="seg-item">遮罩</span>
                    </label>
                    <label>
                        <input type="radio" name="charging-mode" value="hide">
                        <span class="seg-item">隐藏</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="section-group">
            <div class="group-title">视频时长筛选</div>

            <div class="setting-item">
                <div class="label-box">
                    <span>启用时长筛选</span>
                    <span class="tooltip-icon" data-tooltip="根据视频时长过滤首页推荐、搜索结果等位置的视频卡片">?</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-duration-filter">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item column-layout">
                <div class="label-box">
                    <span>时长限制 (Min - Max)</span>
                    <span class="tooltip-icon" data-tooltip="格式如 05:00 或 300 (秒)。Max 为 0 表示不限制最大时长">?</span>
                </div>
                <div class="input-row">
                    <input type="text" id="input-duration-min" placeholder="最小 (05:00)" class="duration-input">
                    <span style="margin: 0 4px; color: #9499a0;">-</span>
                    <input type="text" id="input-duration-max" placeholder="最大 (无限制)" class="duration-input">
                </div>
            </div>

            <div class="setting-item column-layout">
                <div class="label-box">
                    <span>处理方式</span>
                </div>
                <div class="segmented-control">
                    <label>
                        <input type="radio" name="duration-mode" value="hide">
                        <span class="seg-item">隐藏</span>
                    </label>
                    <label>
                        <input type="radio" name="duration-mode" value="dim">
                        <span class="seg-item">淡出</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="section-group">

            <div class="setting-item">
                <div class="label-box">
                    <span>启用视频下载</span>
                    <span class="tooltip-icon" data-tooltip="需启动Bilibili Downloader才能进行下载">?</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-download-video">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="section-group">
            <div class="group-title">社交互动</div>

            <div class="setting-item">
                <div class="label-box">
                    <span>高亮已关注UP主</span>
                    <span class="tooltip-icon" data-tooltip="在评论区、动态列表等位置，将已关注UP主的名字显示为醒目颜色">?</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-highlight">
                    <span class="slider"></span>
                </label>
            </div>

            <button id="btn-force-update" class="btn primary-btn">
                <span class="icon">🔄</span> 同步关注列表
            </button>
        </div>
    </div>

    <div class="footer">
        修改即时生效，无需刷新
    </div>

    <script src="popup.js"></script>
</body>

</html>
